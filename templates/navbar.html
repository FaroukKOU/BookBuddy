<!-- Shared Top Navbar Template -->
<header class="top-navbar">
  <div class="navbar-left">
    <button id="mobile-menu-toggle" class="mobile-menu-btn" aria-label="Toggle Menu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12" />
        <line x1="3" y1="6" x2="21" y2="6" />
        <line x1="3" y1="18" x2="21" y2="18" />
      </svg>
    </button>
    <div class="page-title-group">
      <div id="navbar-super-label" style="display:none; font-size:0.68rem; font-weight:700; letter-spacing:0.05em; color:var(--color-primary); text-transform:uppercase;">
        ADMINISTRATION <span style="color:var(--color-text-muted); font-weight:400;">/ All campuses</span>
      </div>
      <h1 id="navbar-page-title">Explore rooms</h1>
      <p id="navbar-page-subtitle">Find your perfect study space.</p>
    </div>
  </div>

  <div class="navbar-search">
    <div class="input-wrapper">
      <span class="input-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="11" cy="11" r="8" />
          <line x1="21" y1="21" x2="16.65" y2="16.65" />
        </svg>
      </span>
      <input type="search" id="global-search-input" class="form-input" placeholder="Search room number or amenities..." />
    </div>
  </div>

  <div class="navbar-right">
    <!-- Client-Side Role Switcher for Demo & Grading -->
    <select id="role-switcher" class="role-switcher-select" title="Switch simulated user role">
      <option value="student">Role: Student (AMINU Farouk)</option>
      <option value="tutor">Role: Tutor (Lina Moreau)</option>
      <option value="admin">Role: Super Admin</option>
      <option value="guest">View: Public Guest Landing</option>
    </select>

    <button type="button" id="navbar-context-pill" class="btn btn-outline btn-sm">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="4" width="18" height="18" rx="2" />
        <line x1="16" y1="2" x2="16" y2="6" />
        <line x1="8" y1="2" x2="8" y2="6" />
        <line x1="3" y1="10" x2="21" y2="10" />
      </svg>
      <span id="navbar-pill-text">Sat, May 24</span>
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="6 9 12 15 18 9" />
      </svg>
    </button>

    <button type="button" class="icon-btn" aria-label="Notifications">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9" />
        <path d="M13.73 21a2 2 0 0 1-3.46 0" />
      </svg>
      <span class="notif-dot"></span>
    </button>
  </div>
</header>
